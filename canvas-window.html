<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>自由画布</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="glass.css">
  <link rel="stylesheet" href="dark.css">
  <style>
    :root[data-theme="dark"] {--panel:#1d1e20;--card:#242528;--line:#34363a;--line-strong:#4a4d52;}
    body {height:100vh;overflow:hidden;background:var(--panel);background-image:none!important;display:flex;flex-direction:column;}
    header {height:42px;flex:0 0 42px;display:flex;align-items:center;gap:12px;padding:0 12px;border-bottom:1px solid var(--line);-webkit-app-region:drag;user-select:none;}
    header strong {font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;}
    header span {font-size:11px;color:var(--muted);}
    header button {-webkit-app-region:no-drag;border:0;background:transparent;color:var(--muted);font-size:20px;}
    iframe {width:100%;flex:1;min-height:0;border:0;}
    footer {flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 16px;border-top:1px solid var(--line);background:var(--panel);}
    footer span {font-size:11px;color:var(--muted);}
    footer div {display:flex;gap:8px;}
    footer button {padding:6px 14px;font-size:12px;}
    [hidden] {display:none!important;}
  </style>
  <link rel="stylesheet" href="window-pin.css">
  <script src="window-pin.js" defer></script>
</head>
<body>
  <header><strong id="canvasWindowTitle">自由画布</strong><span id="canvasModeLabel">阅读画布</span><button id="closeCanvasWindow" aria-label="关闭">×</button></header>
  <iframe id="floatingCanvas" title="自由画布" src="./canvas-editor/index.html?embedded=view"></iframe>
  <footer><span id="canvasActionHint">阅读模式不会误改内容。</span><div><button id="cancelFloatingCanvas" class="secondary">关闭</button><button id="editFloatingCanvas" class="primary" hidden>编辑</button><button id="confirmFloatingCanvas" class="primary" hidden>确认</button></div></footer>
  <script src="canvas-window.js"></script>
</body>
</html>
